<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReplaySafe — App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0e12;
      --panel: #141820;
      --text: #e8eaef;
      --muted: #8b93a7;
      --accent: #c9a227;
      --accent-hover: #dbb43a;
      --border: rgba(232, 234, 239, 0.1);
      --border-strong: rgba(232, 234, 239, 0.16);
      --ok: #3d9a7a;
      --warn: #e07a6e;
      --input: #0a0c10;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 45% at 50% -15%, rgba(201, 162, 39, 0.07), transparent),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .shell { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; }
    header {
      padding: 1.75rem 0 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 1.25rem; justify-content: space-between; align-items: flex-start;
    }
    header h1 { margin: 0; font-size: 1.35rem; letter-spacing: -0.03em; font-weight: 700; }
    header p { margin: 0.4rem 0 0; color: var(--muted); font-size: 0.9rem; }
    .auth-box {
      display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; font-size: 0.85rem;
    }
    .auth-box input {
      background: var(--input); border: 1px solid var(--border-strong); color: var(--text);
      border-radius: 6px; padding: 0.45rem 0.6rem; width: 9.5rem; font: inherit;
    }
    .auth-box input:focus { outline: none; border-color: var(--accent); }
    main {
      padding: 1.25rem 0 2.5rem;
      display: grid; gap: 1rem; grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.2rem;
    }
    h2 {
      margin: 0 0 0.85rem;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    button {
      background: var(--accent);
      color: #0a0c10;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      font-weight: 600;
      font-size: 0.875rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: transparent; color: var(--text); border: 1px solid var(--border-strong);
    }
    button.secondary:hover { border-color: var(--muted); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    textarea, select {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border-strong);
      color: var(--text);
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.8rem;
      line-height: 1.45;
      margin-bottom: 0.5rem;
    }
    textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    select { font-family: "DM Sans", system-ui, sans-serif; font-size: 0.875rem; width: auto; min-width: 12rem; }
    pre {
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      overflow: auto;
      max-height: 420px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      line-height: 1.5;
      white-space: pre-wrap;
      margin: 0;
    }
    .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.5rem; }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    a.nav { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
    a.nav:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>ReplaySafe</h1>
        <p>Submit → redact → pack / brief / scaffold. <a class="nav" href="/">← Landing</a></p>
        <div class="meta" id="usageMeta">Usage: sign in or use demo token.</div>
      </div>
      <div class="auth-box">
        <input id="email" placeholder="email" value="buyer@acme.dev" />
        <input id="password" type="password" placeholder="password" value="demo-pass" />
        <input id="org" placeholder="org" value="Acme Sec" />
        <button class="secondary" id="btnSignup">Signup</button>
        <button class="secondary" id="btnLogin">Login</button>
        <button class="secondary" id="btnDemo">Use demo</button>
      </div>
    </header>
    <main>
      <section>
        <h2>Submit sample incident</h2>
        <div class="row">
          <button id="btnSample">Load sample</button>
          <button id="btnSubmit">Submit (redacted)</button>
        </div>
        <textarea id="payload" rows="16"></textarea>
        <div class="meta" id="submitMeta"></div>
      </section>
      <section>
        <h2>Pack / brief / scaffold</h2>
        <div class="row">
          <select id="incidentSelect"></select>
          <button class="secondary" id="btnRefresh">Refresh list</button>
          <button id="btnBrief">Brief</button>
          <button id="btnScaffold">Replay scaffold</button>
        </div>
        <pre id="out">Submit an incident to get started.</pre>
      </section>
    </main>
  </div>
  <script>
    const TOKEN_KEY = "replaysafe_token";
    let token = localStorage.getItem(TOKEN_KEY) || "demo";

    const SAMPLE = {
      method: "POST",
      path: "/api/checkout",
      status_code: 500,
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.secret",
        "X-Api-Key": "sk_live_abc123xyz",
        "X-Request-Id": "req-42"
      },
      body: {
        email: "alice@example.com",
        password: "hunter2",
        cart_id: "cart-9",
        amount: 49.99
      },
      logs: [
        "ERROR checkout failed for alice@example.com",
        "Authorization=Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.secret",
        "api_key=sk_live_abc123xyz password=hunter2"
      ],
      metadata: { service: "checkout-api", version: "1.4.2" }
    };

    function authHeaders(json = true) {
      const h = { Authorization: `Bearer ${token}` };
      if (json) h["Content-Type"] = "application/json";
      return h;
    }

    async function refreshUsage() {
      try {
        const res = await fetch("/usage", { headers: authHeaders(false) });
        if (!res.ok) throw new Error();
        const u = await res.json();
        document.getElementById("usageMeta").textContent =
          `Incidents this month: ${u.incidents_used} (${u.month}) · token ${token.slice(0, 12)}…`;
      } catch {
        document.getElementById("usageMeta").textContent = "Sign in or use demo token.";
      }
    }

    document.getElementById("btnSample").onclick = () => {
      document.getElementById("payload").value = JSON.stringify(SAMPLE, null, 2);
    };
    document.getElementById("btnSample").click();

    async function signup() {
      const res = await fetch("/auth/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
          org_name: document.getElementById("org").value,
        }),
      });
      const data = await res.json();
      if (!res.ok) { alert(data.detail || "signup failed"); return; }
      token = data.token;
      localStorage.setItem(TOKEN_KEY, token);
      await refreshUsage();
    }

    async function login() {
      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json();
      if (!res.ok) { alert(data.detail || "login failed"); return; }
      token = data.token;
      localStorage.setItem(TOKEN_KEY, token);
      await refreshUsage();
    }

    function useDemo() {
      token = "demo";
      localStorage.setItem(TOKEN_KEY, token);
      refreshUsage();
    }

    async function submit() {
      let body;
      try { body = JSON.parse(document.getElementById("payload").value); }
      catch (e) { alert("Invalid JSON"); return; }
      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;
      document.getElementById("submitMeta").textContent = "Submitting…";
      try {
        const res = await fetch("/incidents", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify(body),
        });
        const data = await res.json();
        document.getElementById("submitMeta").innerHTML =
          res.ok ? `<span class="ok">Stored ${data.incident.id} (redacted)</span>` :
            `<span class="warn">${data.detail || "failed"}</span>`;
        document.getElementById("out").textContent = JSON.stringify(data, null, 2);
        await refresh();
        await refreshUsage();
        if (data.incident?.id) document.getElementById("incidentSelect").value = data.incident.id;
      } catch {
        document.getElementById("submitMeta").innerHTML = `<span class="warn">Network error</span>`;
      } finally {
        btn.disabled = false;
      }
    }

    async function refresh() {
      const res = await fetch("/incidents", { headers: authHeaders(false) });
      if (!res.ok) return;
      const data = await res.json();
      const sel = document.getElementById("incidentSelect");
      sel.innerHTML = (data.incidents || []).map(i =>
        `<option value="${i.id}">${i.id} · ${i.method || "?"} ${i.path || ""}</option>`
      ).join("") || `<option value="">(none)</option>`;
    }

    async function brief() {
      const id = document.getElementById("incidentSelect").value;
      if (!id) return;
      document.getElementById("out").textContent = "Loading brief…";
      try {
        const res = await fetch(`/incidents/${id}/brief`, { method: "POST", headers: authHeaders(false) });
        document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
      } catch {
        document.getElementById("out").textContent = "Brief failed: network error";
      }
    }

    async function scaffold() {
      const id = document.getElementById("incidentSelect").value;
      if (!id) return;
      document.getElementById("out").textContent = "Loading scaffold…";
      try {
        const res = await fetch(`/incidents/${id}/replay-scaffold`, { method: "POST", headers: authHeaders(false) });
        document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
      } catch {
        document.getElementById("out").textContent = "Scaffold failed: network error";
      }
    }

    document.getElementById("btnSubmit").onclick = submit;
    document.getElementById("btnRefresh").onclick = refresh;
    document.getElementById("btnBrief").onclick = brief;
    document.getElementById("btnScaffold").onclick = scaffold;
    document.getElementById("btnSignup").onclick = signup;
    document.getElementById("btnLogin").onclick = login;
    document.getElementById("btnDemo").onclick = useDemo;
    refreshUsage();
    refresh();
  </script>
</body>
</html>
